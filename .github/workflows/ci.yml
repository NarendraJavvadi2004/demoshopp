name: DemoShop CI

on:
  push:
    branches:
      - master

  schedule:
    # Runs every day at 2:30 AM IST (21:00 UTC)
    - cron: '0 21 * * *'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Installed Browsers
        run: |
          echo "===== Chrome ====="
          google-chrome --version || true

          echo "===== Firefox ====="
          firefox --version || true

          echo "===== Edge ====="
          microsoft-edge --version || true

          echo "===== Browser Paths ====="
          which google-chrome || true
          which firefox || true
          which microsoft-edge || true

      - name: Build Project
        run: mvn clean install -DskipTests

      - name: Run Cross Browser Regression Suite
        run: mvn test

      - name: List Reports
        if: always()
        run: ls -R reports || echo "No reports folder found"

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExtentReport
          path: reports/